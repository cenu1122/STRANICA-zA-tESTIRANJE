<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>AI Glasovni Asistent</title>
</head>
<body>

    <h2>AI Glasovni Asistent (Microsoft Edge Neural)</h2>
    <textarea id="korisnickiTekst" rows="4" cols="50">Reci mi nešto o vještačkoj inteligenciji u jednoj rečenici.</textarea>
    <br>
    <button onclick="posaljiAsistentu()">Pošalji i poslušaj</button>
    
    <!-- Skriveni ili vidljivi audio plejer -->
    <audio id="audioPlejer" controls style="display:block; margin-top:15px;"></audio>

    <script>
        async function posaljiAsistentu() {
            const tekst = document.getElementById("korisnickiTekst").value;
            const plejer = document.getElementById("audioPlejer");

            if (!tekst.trim()) {
                alert("Unesi neki tekst!");
                return;
            }

            try {
                console.log("Šaljem zahtjev prema Supabase funkciji...");

                const response = await fetch("https://lvvidixbdtjfwxxxqzr.supabase.co/functions/v1/MICROSOFT_EDGE_FUNKCIJA_IZGOVOR", {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain"
                        // Ako ti je uključena autentifikacija na Supabase-u, ovdje dodaj:
                        // "Authorization": "Bearer TVOJ_ANON_KEY"
                    },
                    body: tekst
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(errText || "Greška sa servera.");
                }

                // Supabase funkcija vraća MP3 fajl (audio/mpeg)
                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);

                // Postavljamo URL u plejer i pokrećemo reprodukciju
                plejer.src = audioUrl;
                plejer.play();

            } catch (error) {
                console.error("Greška:", error);
                alert("Došlo je do greške: " + error.message);
            }
        }
    </script>

</body>
</html>
