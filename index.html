<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transkript - Autovoxai.com</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .info-box { background: #eef2f3; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .transcript-box { border: 1px solid #ddd; border-radius: 5px; padding: 15px; max-height: 400px; overflow-y: auto; background: #fafafa; }
        .message { margin-bottom: 12px; padding: 10px; border-radius: 6px; }
        .message.user { background: #e1f5fe; }
        .message.assistant { background: #e8f5e9; }
        .role { font-weight: bold; font-size: 0.85em; color: #555; margin-bottom: 4px; text-transform: uppercase; }
        .text { font-size: 1em; line-height: 1.4; }
        .back-btn { display: inline-block; margin-top: 20px; padding: 10px 15px; background: #3498db; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Transkript Razgovora</h1>
    <div id="loading" style="text-align: center; font-weight: bold; color: #666;">Učitavanje podataka...</div>

    <div id="content" style="display: none;">
        <div class="info-box">
            <p><strong>Pronađeni ID u bazi:</strong> <span id="call-id"></span></p>
            <p><strong>Broj Telefona (TO):</strong> <span id="call-to"></span></p>
        </div>

        <h3>Transkript:</h3>
        <div class="transcript-box" id="transcript-container"></div>
    </div>

    <a href="index.html" class="back-btn">← Nazad na Dashboard</a>
</div>

<script>
    const SUPABASE_URL = "https://lvvidixbdtdjfwxxxqzr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2dmlkaXhiZHRkamZ3eHh4cXpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NjgzMjgsImV4cCI6MjA5MTE0NDMyOH0.HE3-5jMrxZ7suTR0lebcfZB-9WqslwExarGoxDYMA_s"; 
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadTranscript() {
        try {
            // Prvo pokušavamo naći tačno ID 35 (malim slovima ili velikim zavisno šta baza traži)
            let { data, error } = await supabaseClient
                .from("RAZGOVORI_TELNYX")
                .select("*")
                .eq("id", 35)
                .maybeSingle();

            // Ako ga tu nema, probaj preko velikog ID-ja ili uzmi zadnji uneti red sa podacima
            if (!data) {
                const res = await supabaseClient
                    .from("RAZGOVORI_TELNYX")
                    .select("*")
                    .order("id", { ascending: false })
                    .limit(1);
                
                if (res.data && res.data.length > 0) {
                    data = res.data[0];
                }
            }

            if (!data) {
                document.getElementById('loading').innerText = "Nema pronađenih zapisa u tabeli.";
                return;
            }

            document.getElementById('call-id').innerText = data.id ?? data.ID ?? 'N/A';
            document.getElementById('call-to').innerText = data.TO ?? 'Nepoznato';

            const transcriptContainer = document.getElementById('transcript-container');
            transcriptContainer.innerHTML = '';

            const transcriptionArray = Array.isArray(data.TRANSKRIPCIJA) ? data.TRANSKRIPCIJA : [];

            if (transcriptionArray.length === 0) {
                transcriptContainer.innerHTML = '<p style="color: #777; text-align: center;">Transkripcija za ovaj red je prazna ([ ]).</p>';
            } else {
                transcriptionArray.forEach(item => {
                    const msgDiv = document.createElement('div');
                    const roleClass = item.role === 'user' ? 'user' : 'assistant';
                    msgDiv.className = `message ${roleClass}`;

                    msgDiv.innerHTML = `
                        <div class="role">${item.role === 'user' ? 'Korisnik (User)' : 'AI Asistent'}</div>
                        <div class="text">${item.text}</div>
                    `;
                    transcriptContainer.appendChild(msgDiv);
                });
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';

        } catch (err) {
            console.error("Greška:", err);
            document.getElementById('loading').innerText = "Došlo je do greške pri učitavanju.";
        }
    }

    window.onload = loadTranscript;
</script>

</body>
</html>
