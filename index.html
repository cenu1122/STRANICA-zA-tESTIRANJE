<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>AI Glasovni Asistent</title>
</head>
<body>

    <h2>AI Glasovni Asistent</h2>
    <textarea id="korisnickiTekst" rows="4" cols="50">Zdravo, kako si?</textarea>
    <br>
    <button onclick="pitajAsistenta()">Pošalji</button>
    <audio id="audioPlejer" controls style="display:block; margin-top:15px;"></audio>

<script>
        async function pitajAsistenta() {
            const tekst = document.getElementById("korisnickiTekst").value;
            if (!tekst.trim()) return;

            try {
                // Pozivamo našu Supabase Edge funkciju umjesto direktno Groq-a
                const response = await fetch("https://lvvidxbdtjfwxxxqzr.supabase.co/functions/v1/MICROSOFT_EDGE_FUNKCIJA_IZGOVOR", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ prompt: tekst })
                });

                if (!response.ok) throw new Error("Greška sa Supabase funkcije");

                const data = await response.json();
                let aiTekst = data.odgovor || "Nema odgovora.";
                
                console.log("AI Odgovor:", aiTekst);

                // Puštamo govor preko Edge-TTS streama
                const glas = "hr-HR-GabrijelaNeural"; 
                const audioUrl = `https://edge-tts-api.hf.space/api/tts?text=${encodeURIComponent(aiTekst)}&voice=${glas}`;
                
                const plejer = document.getElementById("audioPlejer");
                plejer.src = audioUrl;
                plejer.play().catch(() => {
                    const utterance = new SpeechSynthesisUtterance(aiTekst);
                    utterance.lang = 'hr-HR';
                    window.speechSynthesis.speak(utterance);
                });

            } catch (error) {
                console.error("Greška:", error);
                alert("Došlo je do greške: " + error.message);
            }
        }
    </script>

</body>
</html>
