<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>AI Glasovni Asistent</title>
</head>
<body>

    <h2>AI Glasovni Asistent</h2>
    <textarea id="korisnickiTekst" rows="4" cols="50">Zdravo, kako si?</textarea>
    <br>
    <button onclick="pitajAsistenta()">Pošalji</button>
    <audio id="audioPlejer" controls style="display:block; margin-top:15px;"></audio>

    <script>
        async function pitajAsistenta() {
            const tekst = document.getElementById("korisnickiTekst").value;
            if (!tekst.trim()) return;

            try {
                // Pozivamo Groq API direktno, bez Supabase komplikacija
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": "Bearer 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"
                    },
                    body: JSON.stringify({
                        model: "qwen/qwen3.6-27b",
                        messages: [
                            { role: "system", content: "Daj kratak i direktan odgovor u maksimalno 2 rečenice." },
                            { role: "user", content: tekst }
                        ]
                    })
                });

                if (!response.ok) throw new Error("Greška sa Groq servera");

                const data = await response.json();
                let aiTekst = data.choices[0]?.message?.content || "Nema odgovora.";
                
                // Uklanjamo eventualne <think> tagove ako se pojave
                aiTekst = aiTekst.replace(/<think>[\s\S]*?<\/think>/g, "").trim();

                console.log("AI Odgovor:", aiTekst);

                // Puštamo govor preko Edge-TTS streama
                const glas = "hr-HR-GabrijelaNeural"; 
                const audioUrl = `https://edge-tts-api.hf.space/api/tts?text=${encodeURIComponent(aiTekst)}&voice=${glas}`;
                
                const plejer = document.getElementById("audioPlejer");
                plejer.src = audioUrl;
                plejer.play().catch(() => {
                    const utterance = new SpeechSynthesisUtterance(aiTekst);
                    utterance.lang = 'hr-HR';
                    window.speechSynthesis.speak(utterance);
                });

            } catch (error) {
                console.error("Greška:", error);
                alert("Došlo je do greške: " + error.message);
            }
        }
    </script>

</body>
</html>
