<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>AI Glasovni Asistent - Microsoft Edge Neural</title>
</head>
<body>

    <h2>AI Asistent sa Microsoft Edge Glasom</h2>
    <textarea id="tekstZaGovor" rows="4" cols="50">Zdravo! Ja koristim pravi Microsoft Edge neuralni glas, zvučim potpuno prirodno i fluidno.</textarea>
    <br>
    <button onclick="generisiIProsvirajGlas()">Govori</button>
    <audio id="audioPler" controls style="margin-top: 10px; display: block;"></audio>

    <script>
        async function generisiIProsvirajGlas() {
            const tekst = document.getElementById("tekstZaGovor").value;
            const audioPler = document.getElementById("audioPler");

            if (!tekst.trim()) {
                alert("Unesi neki tekst!");
                return;
            }

            try {
                console.log("Generišem Microsoft Edge glas...");
                
                // Koristimo besplatni javni proxy/api za edge-tts koji vraća audio stream
                // Možeš prilagoditi glas u URL-u (npr. hr-HR-GabrijelaNeural, sr-RS-SophieNeural, bs-BA-VesnaNeural)
                const glas = "hr-HR-GabrijelaNeural";
                const encodedText = encodeURIComponent(tekst);
                
                // Primjer poziva na javni edge-tts servis (ili tvoj Supabase/Node backend ako ga tu smjestiš)
                const response = await fetch(`https://edge-tts-api.hf.space/api/tts?text=${encodedText}&voice=${glas}`);
                
                if (!response.ok) {
                    throw new Error("Greška prilikom generisanja glasa sa servera.");
                }

                // Preuzimamo audio kao Blob (fajl u memoriji)
                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);

                // Puštamo audio preko HTML audio elementa
                audioPler.src = audioUrl;
                audioPler.play();

            } catch (error) {
                console.error(error);
                alert("Došlo je do greške: " + error.message);
            }
        }
    </script>

</body>
</html>
