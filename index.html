<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Glasovni AI Asistent</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
      padding: 20px;
    }

    .assistant {
      background: #1f2937;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 10px;
    }

    .status {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    #chat {
      height: 350px;
      overflow-y: auto;
      background: #111827;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .message {
      margin-bottom: 15px;
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .user {
      background: #374151;
      text-align: right;
    }

    .assistant-message {
      background: #2563eb;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
    }

    #sendButton {
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    #sendButton:hover {
      background: #1d4ed8;
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #voiceButton {
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #059669;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #voiceButton:hover {
      background: #047857;
    }

    .info {
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
      color: #9ca3af;
    }

    @media (max-width: 600px) {
      .container {
        padding: 10px;
      }

      .assistant {
        padding: 15px;
      }

      #chat {
        height: 300px;
      }

      .input-area {
        flex-direction: column;
      }

      #sendButton {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="assistant">

      <h1>🤖 AI Asistent</h1>

      <div id="status" class="status">
        Spreman sam.
      </div>

      <div id="chat"></div>

      <div class="input-area">

        <input
          type="text"
          id="messageInput"
          placeholder="Napiši poruku..."
          autocomplete="off"
        >

        <button id="sendButton">
          Pošalji
        </button>

      </div>

      <button id="voiceButton">
  🔊 Testiraj glas
</button>

<button id="micButton">
  🎤 Mikrofon
</button>

<div id="micStatus">
  Mikrofon nije aktivan.
</div>

      <div class="info">
        Trenutno testiramo odgovor i TTS. Mikrofon dodajemo u sljedećem koraku.
      </div>

    </div>

  </div>


<script>

/*
==================================================
SUPABASE EDGE FUNCTION
==================================================
*/

const SUPABASE_FUNCTION_URL =
  "https://lvvidixbdtdjfwxxxqzr.supabase.co/functions/v1/WEB_MOBILNE_APK";


/*
==================================================
ELEMENTI STRANICE
==================================================
*/

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const voiceButton =
  document.getElementById("voiceButton");

const chat =
  document.getElementById("chat");

const status =
  document.getElementById("status");


/*
==================================================
MOBILNI UREĐAJ
==================================================
*/

function isMobileDevice() {

  return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i
    .test(navigator.userAgent);

}


/*
==================================================
DODAVANJE PORUKE U CHAT
==================================================
*/

function addMessage(text, type) {

  const message =
    document.createElement("div");

  message.classList.add("message");

  if (type === "user") {

    message.classList.add("user");

  } else {

    message.classList.add("assistant-message");

  }

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

}


/*
==================================================
TTS (Fallback za browser, opcionalno)
==================================================
*/

function speakResponse(text) {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
    const govor = new SpeechSynthesisUtterance(text);
    govor.lang = "bs-BA";
    window.speechSynthesis.speak(govor);
  }
}


/*
==================================================
SLANJE PORUKE SUPABASEU
==================================================
*/

async function sendMessage(message) {

  try {

    status.textContent =
      "⏳ Razmišljam...";

    sendButton.disabled = true;


    /*
    Prikaži korisnikovu poruku
    */

    addMessage(
      message,
      "user"
    );


    /*
    Pošalji poruku Supabase funkciji
    */

    const response =
      await fetch(
        SUPABASE_FUNCTION_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message: message
          })
        }
      );


    /*
    Pročitaj odgovor
    */

    const data =
      await response.json();


    console.log(
      "Supabase odgovor:",
      data
    );


    /*
    Ako server vrati grešku
    */

    if (!response.ok) {

      console.error(
        "Greška servera:",
        data
      );

      throw new Error(
        data.error ||
        "Greška servera."
      );

    }


    /*
    Provjeri postoji li odgovor
    */

    if (!data.reply) {

      throw new Error(
        "Asistent nije vratio odgovor."
      );

    }


    /*
    Prikaži odgovor
    */

    addMessage(
      data.reply,
      "assistant"
    );


    /*
    POŠALJI ODGOVOR APP INVENTORU ZA ANDROID ZVUČNIK
    */

    if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
        window.AppInventor.setWebViewString(data.reply);
    }


    status.textContent =
      "Spreman sam.";


    return data.reply;


  } catch (error) {

    console.error(
      "sendMessage greška:",
      error
    );


    status.textContent =
      "❌ Greška.";


    addMessage(
      "Došlo je do greške: " +
      error.message,
      "assistant"
    );


  } finally {

    sendButton.disabled = false;

  }

}


/*
==================================================
DUGME POŠALJI
==================================================
*/

sendButton.addEventListener(
  "click",
  function() {

    const message =
      messageInput.value.trim();


    if (!message) {

      return;

    }


    messageInput.value = "";


    sendMessage(
      message
    );

  }
);


/*
==================================================
ENTER ZA SLANJE
==================================================
*/

messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      sendButton.click();

    }

  }
);


/*
==================================================
TEST TTS DUGME
==================================================
*/

voiceButton.addEventListener(
  "click",
  function() {

    const text =
      "Zdravo! Ja sam tvoj AI asistent. Glas radi.";

    speakResponse(text);

  }
);


/*
==================================================
POČETNA PORUKA
==================================================
*/

addMessage(
  "Zdravo! Pošalji mi poruku i odgovorit ću ti glasom.",
  "assistant"
);


/*
==================================================
MIKROFON (Opcionalno, ako zatreba)
==================================================
*/

const micButton =
  document.getElementById("micButton");

const micStatus =
  document.getElementById("micStatus");

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (!SpeechRecognition) {

  micStatus.textContent =
    "❌ Ovaj browser ne podržava prepoznavanje govora.";

  micButton.disabled = true;

} else {

  const recognition =
    new SpeechRecognition();

  recognition.lang = "bs-BA";

  recognition.continuous = false;

  recognition.interimResults = false;


  micButton.addEventListener(
    "click",
    function() {

      try {

        recognition.start();

        micStatus.textContent =
          "🎤 Slušam... Govori sada.";

        micButton.textContent =
          "🛑 Slušam...";

      } catch (error) {

        console.error(
          "Greška mikrofona:",
          error
        );

      }

    }
  );


  recognition.onresult =
    function(event) {

      const text =
        event.results[0][0].transcript;

      messageInput.value =
        text;

      micStatus.textContent =
        "✅ Čuo sam: " + text;

      micButton.textContent =
        "🎤 Mikrofon";

    };


  recognition.onerror =
    function(event) {

      micStatus.textContent =
        "❌ Greška mikrofona: " +
        event.error;

      micButton.textContent =
        "🎤 Mikrofon";

    };


  recognition.onend =
    function() {

      micButton.textContent =
        "🎤 Mikrofon";

    };

}

</script>

</body>
</html>
