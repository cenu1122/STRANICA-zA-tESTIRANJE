<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transkript Razgovora - Autovoxai.com</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .info-box { background: #eef2f3; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        
        /* Chat kontejner */
        .transcript-box { 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            padding: 20px; 
            max-height: 500px; 
            overflow-y: auto; 
            background: #ffffff; 
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Stilizacija poruka kao chat baloni */
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* Korisnik (Lijeva strana) */
        .message.user {
            background: #e1f5fe;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        /* AI Asistent (Desna strana) */
        .message.assistant {
            background: #e8f5e9;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .role { font-weight: bold; font-size: 0.75em; margin-bottom: 4px; text-transform: uppercase; color: #555; }
        .text { font-size: 1em; line-height: 1.4; word-break: break-word; }
        .time { font-size: 0.7em; color: #888; text-align: right; margin-top: 4px; }
        
        .back-btn { display: inline-block; margin-top: 20px; padding: 10px 15px; background: #3498db; color: white; text-decoration: none; border-radius: 4px; }
        .back-btn:hover { background: #2980b9; }
    </style>
</head>
<body>

<div class="container">
    <h1>Hronološki Pregled Razgovora (Chat)</h1>
    <div id="loading" style="text-align: center; font-weight: bold; color: #666;">Učitavanje podataka iz reda 35...</div>

    <div id="content" style="display: none;">
        <div class="info-box">
            <p><strong>ID Reda:</strong> <span id="call-id"></span></p>
            <p><strong>Broj Telefona:</strong> <span id="call-to"></span></p>
        </div>

        <h3>Razgovor:</h3>
        <div class="transcript-box" id="transcript-container"></div>
    </div>

    <a href="index.html" class="back-btn">← Nazad na Dashboard</a>
</div>

<script>
    const SUPABASE_URL = "https://lvvidixbdtdjfwxxxqzr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2dmlkaXhiZHRkamZ3eHh4cXpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NjgzMjgsImV4cCI6MjA5MTE0NDMyOH0.HE3-5jMrxZ7suTR0lebcfZB-9WqslwExarGoxDYMA_s"; 
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadTranscript() {
        try {
            let { data, error } = await supabaseClient
                .from("RAZGOVORI_TELNYX")
                .select("*")
                .eq("ID", 35)
                .maybeSingle();

            if (!data) {
                const res = await supabaseClient
                    .from("RAZGOVORI_TELNYX")
                    .select("*")
                    .order("ID", { ascending: false })
                    .limit(1);
                
                if (res.data && res.data.length > 0) {
                    data = res.data[0];
                }
            }

            if (!data) {
                document.getElementById('loading').innerText = "Nema pronađenih zapisa u tabeli.";
                return;
            }

            document.getElementById('call-id').innerText = data.ID ?? 'N/A';
            document.getElementById('call-to').innerText = data.TO ?? 'Nepoznato';

            const transcriptContainer = document.getElementById('transcript-container');
            transcriptContainer.innerHTML = '';

            let transcriptionArray = [];
            if (typeof data.TRANSKRIPCIJA === 'string') {
                try {
                    transcriptionArray = JSON.parse(data.TRANSKRIPCIJA);
                } catch (e) {
                    transcriptionArray = [];
                }
            } else if (Array.isArray(data.TRANSKRIPCIJA)) {
                transcriptionArray = data.TRANSKRIPCIJA;
            }

            if (transcriptionArray.length === 0) {
                transcriptContainer.innerHTML = '<p style="color: #777; text-align: center;">Transkripcija je trenutno prazna ([ ]).</p>';
            } else {
                transcriptionArray.forEach(item => {
                    const msgDiv = document.createElement('div');
                    const isUser = item.role === 'user';
                    msgDiv.className = `message ${isUser ? 'user' : 'assistant'}`;

                    const roleName = isUser ? 'Korisnik' : 'AI Asistent';
                    const timeFormatted = item.timestamp ? new Date(item.timestamp).toLocaleTimeString() : '';

                    msgDiv.innerHTML = `
                        <div class="role">${roleName}</div>
                        <div class="text">${item.text || ''}</div>
                        ${timeFormatted ? `<div class="time">${timeFormatted}</div>` : ''}
                    `;
                    transcriptContainer.appendChild(msgDiv);
                });
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';

        } catch (err) {
            console.error("Greška:", err);
            document.getElementById('loading').innerText = "Došlo je do greške pri učitavanju.";
        }
    }

    window.onload = loadTranscript;
</script>

</body>
</html>
